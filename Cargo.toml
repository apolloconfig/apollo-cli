[package]
name = "apollo-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "apollo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
keyring = "3.6.3"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serde_json = "1.0.145"
tempfile = "3.23.0"
